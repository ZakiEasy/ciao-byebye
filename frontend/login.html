<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciao Byebye - Connexion Portail Pro KDS</title>
    <!-- Google Fonts (Outfit & Cairo for Arabic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style variables -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        body {
            padding-bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0c 0%, #121217 100%);
            position: relative;
        }

        .login-top-bar {
            position: absolute;
            top: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        html[dir="rtl"] .login-top-bar {
            right: auto;
            left: 24px;
        }

        .lang-picker-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .lang-picker-btn:hover, .lang-picker-btn:focus {
            border-color: var(--primary);
            background: rgba(245, 158, 11, 0.1);
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .login-card {
            padding: 36px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            text-align: center;
            box-shadow: var(--shadow-main);
            position: relative;
        }

        .login-card h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-card p {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* SSO Provider Buttons */
        .sso-buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .sso-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sso-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .sso-btn i {
            font-size: 16px;
        }

        .sso-btn.google i {
            color: #ea4335;
        }

        .sso-btn.apple i {
            color: var(--text-primary);
        }

        .sso-btn.microsoft i {
            color: #00a4ef;
        }

        /* Separator */
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin: 20px 0;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border);
        }

        .separator:not(:empty)::before {
            margin-right: 12px;
        }

        .separator:not(:empty)::after {
            margin-left: 12px;
        }

        html[dir="rtl"] .separator:not(:empty)::before {
            margin-right: 0;
            margin-left: 12px;
        }

        html[dir="rtl"] .separator:not(:empty)::after {
            margin-left: 0;
            margin-right: 12px;
        }

        /* Traditional form */
        .input-group {
            text-align: left;
            margin-bottom: 16px;
        }

        html[dir="rtl"] .input-group {
            text-align: right;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
        }

        .login-submit-btn {
            width: 100%;
            background: var(--primary);
            border: 1px solid var(--primary);
            color: #000;
            padding: 12px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .login-submit-btn:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        html[dir="rtl"] {
            font-family: 'Cairo', 'Outfit', sans-serif;
        }
    </style>
</head>
<body>

    <!-- Language Selector in Top Bar -->
    <div class="login-top-bar">
        <label for="login-lang-select" style="font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-globe"></i> <span id="lbl-lang-text">Langue :</span>
        </label>
        <select id="login-lang-select" onchange="setLoginLanguage(this.value)" class="lang-picker-btn" aria-label="Choisir la langue">
            <option value="fr">🇫🇷 Français (FR)</option>
            <option value="en">🇬🇧 English (EN)</option>
            <option value="ar">🇸🇦 العربية (AR)</option>
            <option value="es">🇪🇸 Español (ES)</option>
        </select>
    </div>

    <div class="login-container">
        <div class="login-card glass animate-fade-in">
            <div class="logo" style="margin-bottom: 12px; font-size: 28px;">
                <span class="logo-accent">Ciao</span> Byebye
            </div>
            <h2 id="login-title">Portail Pro Cuisine & KDS</h2>
            <p id="login-desc">Connectez-vous pour accéder au tableau de bord KDS</p>

            <!-- Staff Profile Selector -->
            <div class="input-group" style="margin-bottom: 20px;">
                <label for="sso-profile" id="lbl-demo-profile">Compte Utilisateur Don Roberto (SSO / Démo)</label>
                <select id="sso-profile">
                    <option value="gerant.don-roberto@ciao-byebye.fr" id="opt-boss" selected>👔 Gérant / Direction (gerant.don-roberto@ciao-byebye.fr)</option>
                    <option value="serveur.don-roberto@ciao-byebye.fr" id="opt-serveur">🤵 Serveur / Salle (serveur.don-roberto@ciao-byebye.fr)</option>
                    <option value="cuisine.don-roberto@ciao-byebye.fr" id="opt-chef">🍕 Cuisine / Chef Pizzaiolo (cuisine.don-roberto@ciao-byebye.fr)</option>
                    <option value="comptoir.don-roberto@ciao-byebye.fr" id="opt-pickup">🖥️ Comptoir / Caisse (comptoir.don-roberto@ciao-byebye.fr)</option>
                    <option value="superadmin@ciao-byebye.fr" id="opt-superadmin">👑 SuperAdmin Global (superadmin@ciao-byebye.fr)</option>
                </select>
            </div>

            <!-- SSO Options -->
            <div class="sso-buttons-container">
                <button class="sso-btn google" onclick="triggerSSO('Google')">
                    <i class="fa-brands fa-google"></i> <span id="btn-sso-google">Se connecter avec Google</span>
                </button>
                <button class="sso-btn apple" onclick="triggerSSO('Apple')">
                    <i class="fa-brands fa-apple"></i> <span id="btn-sso-apple">Se connecter avec Apple</span>
                </button>
                <button class="sso-btn microsoft" onclick="triggerSSO('Microsoft')">
                    <i class="fa-brands fa-windows"></i> <span id="btn-sso-microsoft">Se connecter avec Microsoft</span>
                </button>
            </div>

            <div class="separator" id="separator-text">ou identifiants de secours</div>

            <!-- Traditional login form -->
            <form onsubmit="handleManualLogin(event)">
                <div class="input-group">
                    <label for="email" id="lbl-email">Adresse e-mail</label>
                    <input type="email" id="email" required placeholder="gerant.don-roberto@ciao-byebye.fr">
                </div>
                <div class="input-group">
                    <label for="password" id="lbl-password">Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="login-submit-btn" id="btn-login-submit">Se connecter</button>
            </form>
        </div>
    </div>

    <script>
        const loginTranslations = {
            fr: {
                lang_label: "Langue :",
                title: "Portail Pro Cuisine & KDS",
                desc: "Connectez-vous pour accéder au tableau de bord KDS",
                demo_profile: "Compte Utilisateur Don Roberto (SSO / Démo)",
                opt_superadmin: "👑 SuperAdmin Global (superadmin@ciao-byebye.fr)",
                opt_chef: "🍕 Cuisine / Chef Pizzaiolo (cuisine.don-roberto@ciao-byebye.fr)",
                opt_serveur: "🤵 Serveur / Salle (serveur.don-roberto@ciao-byebye.fr)",
                opt_boss: "👔 Gérant / Direction (gerant.don-roberto@ciao-byebye.fr)",
                opt_pickup: "🖥️ Comptoir / Caisse (comptoir.don-roberto@ciao-byebye.fr)",
                btn_google: "Se connecter avec Google",
                btn_apple: "Se connecter avec Apple",
                btn_microsoft: "Se connecter avec Microsoft",
                separator: "ou identifiants de secours",
                lbl_email: "Adresse e-mail",
                lbl_password: "Mot de passe",
                btn_submit: "Se connecter"
            },
            en: {
                lang_label: "Language:",
                title: "Kitchen & KDS Pro Portal",
                desc: "Sign in to access the KDS kitchen dashboard",
                demo_profile: "Don Roberto Staff Account (SSO / Demo)",
                opt_superadmin: "👑 Global SuperAdmin (superadmin@ciao-byebye.fr)",
                opt_chef: "🍕 Kitchen / Pizzaiolo (cuisine.don-roberto@ciao-byebye.fr)",
                opt_serveur: "🤵 Waiter / Floor Staff (serveur.don-roberto@ciao-byebye.fr)",
                opt_boss: "👔 General Manager / Direction (gerant.don-roberto@ciao-byebye.fr)",
                opt_pickup: "🖥️ Front Desk / Cashier (comptoir.don-roberto@ciao-byebye.fr)",
                btn_google: "Sign in with Google",
                btn_apple: "Sign in with Apple",
                btn_microsoft: "Sign in with Microsoft",
                separator: "or manual credentials",
                lbl_email: "Email address",
                lbl_password: "Password",
                btn_submit: "Sign In"
            },
            ar: {
                lang_label: "اللغة :",
                title: "بوابة المطبخ وإدارة الطلبات KDS",
                desc: "سجّل الدخول للوصول إلى لوحة تحكم المطبخ والخدمة",
                demo_profile: "حساب الطاقم دون روبرتو (SSO)",
                opt_superadmin: "👑 المشرف العام المتميز (superadmin@ciao-byebye.fr)",
                opt_chef: "🍕 المطبخ / صانع البيتزا (cuisine.don-roberto@ciao-byebye.fr)",
                opt_serveur: "🤵 النادل / طاقم الصالة (serveur.don-roberto@ciao-byebye.fr)",
                opt_boss: "👔 المدير العام / الإدارة (gerant.don-roberto@ciao-byebye.fr)",
                opt_pickup: "🖥️ الكاونتر والصندوق (comptoir.don-roberto@ciao-byebye.fr)",
                btn_google: "تسجيل الدخول عبر Google",
                btn_apple: "تسجيل الدخول عبر Apple",
                btn_microsoft: "تسجيل الدخول عبر Microsoft",
                separator: "أو عبر بيانات الدخول البديلة",
                lbl_email: "البريد الإلكتروني",
                lbl_password: "كلمة المرور",
                btn_submit: "تسجيل الدخول"
            },
            es: {
                lang_label: "Idioma:",
                title: "Portal Pro Cocina & KDS",
                desc: "Inicia sesión para acceder al panel KDS",
                demo_profile: "Cuenta Personal Don Roberto (SSO)",
                opt_superadmin: "👑 SuperAdmin Global (superadmin@ciao-byebye.fr)",
                opt_chef: "🍕 Cocina / Pizzaiolo (cuisine.don-roberto@ciao-byebye.fr)",
                opt_serveur: "🤵 Camarero / Sala (serveur.don-roberto@ciao-byebye.fr)",
                opt_boss: "👔 Gerente / Dirección (gerant.don-roberto@ciao-byebye.fr)",
                opt_pickup: "🖥️ Mostrador / Caja (comptoir.don-roberto@ciao-byebye.fr)",
                btn_google: "Iniciar sesión con Google",
                btn_apple: "Iniciar sesión con Apple",
                btn_microsoft: "Iniciar sesión con Microsoft",
                separator: "o credenciales de emergencia",
                lbl_email: "Correo electrónico",
                lbl_password: "Contraseña",
                btn_submit: "Iniciar sesión"
            }
        };

        let currentLoginLang = localStorage.getItem('ciao_kds_lang') || 'fr';

        function setLoginLanguage(lang) {
            currentLoginLang = lang;
            localStorage.setItem('ciao_kds_lang', lang);
            localStorage.setItem('ciao_lang', lang);

            const select = document.getElementById('login-lang-select');
            if (select) select.value = lang;

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', lang);
            }

            const t = loginTranslations[lang] || loginTranslations.fr;
            document.getElementById('lbl-lang-text').innerText = t.lang_label;
            document.getElementById('login-title').innerText = t.title;
            document.getElementById('login-desc').innerText = t.desc;
            document.getElementById('lbl-demo-profile').innerText = t.demo_profile;
            
            if (document.getElementById('opt-superadmin')) document.getElementById('opt-superadmin').innerText = t.opt_superadmin;
            if (document.getElementById('opt-chef')) document.getElementById('opt-chef').innerText = t.opt_chef;
            if (document.getElementById('opt-serveur')) document.getElementById('opt-serveur').innerText = t.opt_serveur;
            if (document.getElementById('opt-boss')) document.getElementById('opt-boss').innerText = t.opt_boss;
            if (document.getElementById('opt-pickup')) document.getElementById('opt-pickup').innerText = t.opt_pickup;

            if (document.getElementById('btn-sso-google')) document.getElementById('btn-sso-google').innerText = t.btn_google;
            if (document.getElementById('btn-sso-apple')) document.getElementById('btn-sso-apple').innerText = t.btn_apple;
            if (document.getElementById('btn-sso-microsoft')) document.getElementById('btn-sso-microsoft').innerText = t.btn_microsoft;

            document.getElementById('separator-text').innerText = t.separator;
            document.getElementById('lbl-email').innerText = t.lbl_email;
            document.getElementById('lbl-password').innerText = t.lbl_password;
            document.getElementById('btn-login-submit').innerText = t.btn_submit;
        }

        // Initialize language
        document.addEventListener('DOMContentLoaded', () => {
            setLoginLanguage(currentLoginLang);
        });

        // Check if already authenticated
        if (sessionStorage.getItem('ciao_byebye_auth') === 'true') {
            const role = sessionStorage.getItem('ciao_byebye_role');
            if (role === 'superadmin') {
                window.location.href = 'admin-hq.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        // SSO triggers (Mocking redirect behavior to simulated OAuth callbacks)
        function triggerSSO(provider) {
            const email = document.getElementById('sso-profile').value;
            console.log(`Initialisation de l'authentification SSO avec ${provider} pour ${email}...`);
            const mockState = Math.random().toString(36).substring(7);
            
            // Redirection vers le callback d'authentification simulant le retour de l'OAuth Provider
            window.location.href = `/api/auth/sso/callback?provider=${provider.toLowerCase()}&state=${mockState}&email=${encodeURIComponent(email)}`;
        }

        // Manual fallback login handling
        function handleManualLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (email && password) {
                window.location.href = `/api/auth/sso/callback?provider=manual&email=${encodeURIComponent(email)}`;
            }
        }
    </script>
</body>
</html>
