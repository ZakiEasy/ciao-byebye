<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciao Byebye - KDS Cuisine</title>
    <!-- Google Fonts (Outfit & Cairo for Arabic RTL) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style variables -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific Dashboard overrides */
        body {
            padding-bottom: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #08080a;
        }

        .dashboard-header {
            padding: 16px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .dashboard-header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .stats-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge span {
            color: var(--primary);
            font-weight: 600;
        }

        .dashboard-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px 30px;
            height: calc(100vh - 75px);
            overflow: hidden;
        }

        .kds-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }

        .column-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-header .count {
            background: var(--primary);
            color: #000;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .cards-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 8px;
        }

        .order-card {
            padding: 18px;
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
        }

        .order-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .client-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .client-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .table-num {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
        }

        .card-items {
            list-style: none;
            margin: 12px 0;
            padding: 10px 0;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .card-items li {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .card-items li:last-child {
            margin-bottom: 0;
        }

        .item-qty-name {
            display: flex;
            gap: 10px;
        }

        .item-qty {
            color: var(--primary);
            font-weight: 700;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary);
            color: #000;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .action-btn:hover {
            filter: brightness(1.1);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .empty-column-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
            font-style: italic;
            font-size: 14px;
        }

        .queue-badge {
            background: #ef4444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .elapsed-timer {
            font-size: 11px;
            color: #f59e0b;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* PUBLIC PICKUP SCREEN STYLING (Comptoir Public & 4K Large Display) */
        .pickup-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 24px;
            height: 100%;
            padding: 10px 0;
        }

        .pickup-column {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .pickup-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pickup-list {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 12px;
            overflow-y: auto;
        }

        .pickup-name-card {
            font-size: 22px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            display: flex;
            align-items: center;
            animation: scaleIn 0.3s ease;
        }

        .pickup-name-card.ready {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #10b981;
            animation: pulseReady 1.5s infinite;
        }

        @keyframes pulseReady {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px 4px rgba(16, 185, 129, 0.3); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Video Showcase Column on Pickup Display */
        .pickup-media-column {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .promo-video-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-md);
        }

        .promo-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .video-playlist-tabs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        .playlist-tab {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .playlist-tab:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .playlist-tab.active {
            background: rgba(245, 158, 11, 0.15);
            border-color: var(--primary);
        }

        .playlist-tab-info strong {
            display: block;
            font-size: 13px;
            color: #fff;
        }

        .playlist-tab-info span {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 4K TV & Huge Display Screen Adaptation */
        @media (min-width: 1800px) {
            .dashboard-header h1 { font-size: 28px; }
            .pickup-title { font-size: 34px; }
            .pickup-name-card { font-size: 32px; padding: 20px 30px; }
            .column-header h2 { font-size: 24px; }
            .client-info h3 { font-size: 24px; }
            .card-items li { font-size: 18px; }
            .order-card { padding: 26px; }
            .dashboard-content { gap: 30px; padding: 30px; }
            .promo-video-wrapper { height: 340px; }
        }

        /* Responsive Mobile / Small Displays */
        @media (max-width: 1100px) {
            .pickup-container { grid-template-columns: 1fr 1fr; }
            .pickup-media-column { grid-column: span 2; }
        }

        @media (max-width: 900px) {
            body { height: auto; overflow: auto; }
            .dashboard-header { flex-direction: column; gap: 12px; align-items: stretch; }
            .stats-container { justify-content: space-between; flex-wrap: wrap; }
            .dashboard-content { grid-template-columns: 1fr; height: auto; padding: 20px 16px; overflow: visible; }
            .pickup-container { grid-template-columns: 1fr; }
            .pickup-media-column { grid-column: span 1; }
        }

        /* RTL Overrides for KDS */
        html[dir="rtl"] {
            font-family: 'Cairo', 'Outfit', sans-serif;
        }
        html[dir="rtl"] .dashboard-header,
        html[dir="rtl"] .stats-container,
        html[dir="rtl"] .card-header,
        html[dir="rtl"] .item-qty-name,
        html[dir="rtl"] .pickup-title,
        html[dir="rtl"] .playlist-tab {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .client-info,
        html[dir="rtl"] .column-header h2,
        html[dir="rtl"] .menu-mgmt-panel h2,
        html[dir="rtl"] .menu-mgmt-panel p,
        html[dir="rtl"] .playlist-tab-info {
            text-align: right;
        }

        /* Menu management overlay */
        .menu-mgmt-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            height: 100%;
            overflow-y: auto;
        }

        .menu-mgmt-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .menu-mgmt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
        }

        /* Switch toggles */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s; border-radius: 24px; border: 1px solid var(--glass-border);
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Waiter assignment table */
        .assignment-view {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
            height: 100%;
        }
        .assignment-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .assignment-table th, .assignment-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--glass-border);
            text-align: left;
            font-size: 14px;
        }
        html[dir="rtl"] .assignment-table th, html[dir="rtl"] .assignment-table td {
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- Top Manager Role Switcher (For Demo & Multi-tenant simulation) -->
    <div id="manager-switcher-container" style="display:none; background: #f59e0b; color: #000; padding: 6px 20px; font-size: 13px; font-weight: 600; text-align: center; border-bottom: 1px solid #d97706;">

                    <option value="barman@atelier-chris.fr">🍹 Barman (barman@ - Boissons)</option>

            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="dashboard-header">
        <div class="logo">
            <span class="logo-accent">Ciao</span> Byebye 
            <span id="dashboard-role-title" style="font-size: 14px; font-weight:400; color:var(--text-muted); margin-left: 10px;">Tableau de Bord</span>
        </div>
        <div class="stats-container">
            <!-- Lang, Currency & Fullscreen Selectors -->
            <div class="i18n-selectors" style="display:flex; align-items:center; gap:6px;">
                <select id="kds-lang-select" onchange="changeKdsLanguage(this.value)" class="glass-select" aria-label="Langue">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="es">🇪🇸 ES</option>
                </select>
                <select id="kds-currency-select" onchange="changeKdsCurrency(this.value)" class="glass-select" aria-label="Devise">
                    <option value="EUR">EUR (€)</option>
                    <option value="USD">USD ($)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="MAD">MAD (DH)</option>
                    <option value="SAR">SAR (﷼)</option>
                    <option value="AED">AED (د.إ)</option>
                </select>
                <button onclick="toggleFullscreen()" class="glass-select" title="Plein Écran TV" style="display:flex; align-items:center; justify-content:center; padding:6px 10px;">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>

            <div id="header-btn-container">
                <!-- Buttons like 'Gérer le Menu' load here -->
            </div>
            
            <div class="stat-badge">
                <i class="fa-solid fa-fire-burner"></i> <span id="stat-cooking-label">En Cuisine :</span> <span id="stat-cooking">0</span>
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-mug-hot"></i> <span id="stat-ready-label">Prêtes :</span> <span id="stat-ready">0</span>
            </div>
            
            <div class="user-profile" style="display: flex; align-items: center; gap: 12px; border-left: 1px solid var(--glass-border); padding-left: 15px;">
                <span id="user-email" style="font-size: 13px; color: var(--text-muted);">chef@atelier-chris.fr</span>
                <button onclick="logout()" title="Déconnexion" style="background: none; border: none; color: #ef4444; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: inherit;"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Columns Grid -->
    <main class="dashboard-content" id="dashboard-main-content">
        <!-- Dynamic content rendered via JS -->
    </main>

    <!-- WebSockets & Logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Promotional & Preparation Video Playlist for Public Display
        const promoVideos = [
            {
                id: "milkshake",
                title: "🥤 Milkshake Gourmet Fraise & Chantilly",
                desc: "Préparation onctueuse et crémeuse au lait bio et coulis de fraises fraîches.",
                src: "https://assets.mixkit.co/videos/preview/mixkit-pouring-milk-into-a-glass-with-strawberries-42995-large.mp4",
                badge: "Recette du Chef"
            },
            {
                id: "tacos",
                title: "🌮 Tacos & Smash Burgers Grill",
                desc: "Cuisson de viande hachée fraîche, cheddar fondant et sauce maison.",
                src: "https://assets.mixkit.co/videos/preview/mixkit-frying-a-hamburger-patty-on-a-grill-42939-large.mp4",

            },

            {

                badge: "Offre Spéciale"

        ];

        let currentPromoVideoIndex = 0;

        function setPromoVideo(index) {
            currentPromoVideoIndex = index;
            const videoEl = document.getElementById('kiosk-promo-video');
            const badgeEl = document.getElementById('kiosk-video-badge');
            if (videoEl && promoVideos[index]) {
                videoEl.src = promoVideos[index].src;
                videoEl.play().catch(e => console.log('Autoplay handled'));
                if (badgeEl) badgeEl.innerText = promoVideos[index].badge;
            }
            document.querySelectorAll('.playlist-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });
        }

        function formatKdsPrice(euroAmount) {
            const curr = kdsCurrencies[kdsCurrency] || kdsCurrencies.EUR;
            const converted = euroAmount * curr.rate;
            const formatted = converted.toFixed(2);
            return curr.position === 'before' ? `${curr.symbol} ${formatted}` : `${formatted} ${curr.symbol}`;
        }

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');

        async function assignTableToStaff(tableNum, email) {
            for (const waiter of staffList) {
                if (waiter.assigned_tables.includes(tableNum)) {
                    waiter.assigned_tables = waiter.assigned_tables.filter(t => t !== tableNum);
                    await saveWaiterAssignment(waiter.email, waiter.assigned_tables);
                }
            }

            if (email) {
                const targetWaiter = staffList.find(s => s.email === email);
                if (targetWaiter) {
                    targetWaiter.assigned_tables.push(tableNum);
                    await saveWaiterAssignment(email, targetWaiter.assigned_tables);
                }
            }

            fetchOrders();
        }

        async function saveWaiterAssignment(email, tables) {
            try {
                await fetch('/api/staff/assign-tables', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, tables })
                });
            } catch (err) {
                console.error('Failed to assign table:', err);
            }
        }

                `;
            } catch (error) {
                console.error(error);
            }
        }

        async function toggleProductAvailability(productId, isAvailable) {
            try {
                await fetch(`/api/menu/${productId}/availability`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_available: isAvailable })
                });
            } catch (err) {
                console.error(err);
            }
        }

        function updateTimersDisplay() {
            const t = kdsTranslations[kdsLang] || kdsTranslations.fr;
            const badges = document.querySelectorAll('.elapsed-timer');
            badges.forEach(badge => {
                const createdAt = badge.dataset.time;
                if (createdAt) {
                    const elapsedMin = Math.floor((new Date() - new Date(createdAt)) / 60000);
                    badge.innerText = `⏱️ ${elapsedMin} ${t.timer_min}`;
                }
            });
        }

        async function updateOrderStatus(orderId, status) {
            try {
                const response = await fetch(`/api/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });

                if (!response.ok) throw new Error('Failed to update order status');
                fetchOrders();
            } catch (error) {
                console.error('Error updating order status:', error);
            }
        }

        async function collectCashPayment(orderId) {
            try {
                const res = await fetch(`/api/orders/${orderId}/cash-payment`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (!res.ok) throw new Error('Erreur encaissement');
                fetchOrders();
            } catch (e) {
                console.error('Erreur encaissement espèces:', e);
                alert('Erreur lors de la validation du paiement en espèces.');
            }
        }

        if (socket) {
            socket.on('new_order', () => {
                fetchOrders();
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                } catch (e) {
                    console.log('Audio alert blocked or failed');
                }
            });

            socket.on('order_status_updated', () => {
                fetchOrders();
            });

            socket.on('tables_assigned', () => {
                if (activeRole === 'chef_de_salle' || activeRole === 'serveur') {
                    fetchOrders();
                }
            });

            socket.on('menu_updated', () => {
                if (showMenuManagement) {
                    renderMenuManagement();
                }
            });
        }
    </script>
</body>
</html>
