<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciao Byebye - KDS Cuisine</title>
    <!-- Google Fonts (Outfit & Cairo for Arabic RTL) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style variables -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Specific Dashboard overrides */
        body {
            padding-bottom: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #08080a;
        }

        .dashboard-header {
            padding: 16px 30px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .dashboard-header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .stats-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge span {
            color: var(--primary);
            font-weight: 600;
        }

        .dashboard-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding: 24px 30px;
            height: calc(100vh - 75px);
            overflow: hidden;
        }

        .kds-column {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }

        .column-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-header .count {
            background: var(--primary);
            color: #000;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .cards-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-right: 8px;
        }

        .order-card {
            padding: 18px;
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
        }

        .order-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .client-info h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .client-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .table-num {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
        }

        .card-items {
            list-style: none;
            margin: 12px 0;
            padding: 10px 0;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .card-items li {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .card-items li:last-child {
            margin-bottom: 0;
        }

        .item-qty-name {
            display: flex;
            gap: 10px;
        }

        .item-qty {
            color: var(--primary);
            font-weight: 700;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--primary);
            color: #000;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .action-btn:hover {
            filter: brightness(1.1);
        }

        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .action-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .empty-column-msg {
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
            font-style: italic;
            font-size: 14px;
        }

        .queue-badge {
            background: #ef4444;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
        }

        .elapsed-timer {
            font-size: 11px;
            color: #f59e0b;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* PUBLIC PICKUP SCREEN STYLING (Comptoir Public & 4K Large Display) */
        .pickup-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1.1fr;
            gap: 24px;
            height: 100%;
            padding: 10px 0;
        }

        .pickup-column {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .pickup-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pickup-list {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 12px;
            overflow-y: auto;
        }

        .pickup-name-card {
            font-size: 22px;
            font-weight: 700;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: #ffffff;
            display: flex;
            align-items: center;
            animation: scaleIn 0.3s ease;
        }

        .pickup-name-card.ready {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #10b981;
            animation: pulseReady 1.5s infinite;
        }

        @keyframes pulseReady {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { transform: scale(1.03); box-shadow: 0 0 20px 4px rgba(16, 185, 129, 0.3); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Video Showcase Column on Pickup Display */
        .pickup-media-column {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .promo-video-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-md);
        }

        .promo-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .video-playlist-tabs {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        .playlist-tab {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .playlist-tab:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .playlist-tab.active {
            background: rgba(245, 158, 11, 0.15);
            border-color: var(--primary);
        }

        .playlist-tab-info strong {
            display: block;
            font-size: 13px;
            color: #fff;
        }

        .playlist-tab-info span {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 4K TV & Huge Display Screen Adaptation */
        @media (min-width: 1800px) {
            .dashboard-header h1 { font-size: 28px; }
            .pickup-title { font-size: 34px; }
            .pickup-name-card { font-size: 32px; padding: 20px 30px; }
            .column-header h2 { font-size: 24px; }
            .client-info h3 { font-size: 24px; }
            .card-items li { font-size: 18px; }
            .order-card { padding: 26px; }
            .dashboard-content { gap: 30px; padding: 30px; }
            .promo-video-wrapper { height: 340px; }
        }

        /* Responsive Mobile / Small Displays */
        @media (max-width: 1100px) {
            .pickup-container { grid-template-columns: 1fr 1fr; }
            .pickup-media-column { grid-column: span 2; }
        }

        @media (max-width: 900px) {
            body { height: auto; overflow: auto; }
            .dashboard-header { flex-direction: column; gap: 12px; align-items: stretch; }
            .stats-container { justify-content: space-between; flex-wrap: wrap; }
            .dashboard-content { grid-template-columns: 1fr; height: auto; padding: 20px 16px; overflow: visible; }
            .pickup-container { grid-template-columns: 1fr; }
            .pickup-media-column { grid-column: span 1; }
        }

        /* RTL Overrides for KDS */
        html[dir="rtl"] {
            font-family: 'Cairo', 'Outfit', sans-serif;
        }
        html[dir="rtl"] .dashboard-header,
        html[dir="rtl"] .stats-container,
        html[dir="rtl"] .card-header,
        html[dir="rtl"] .item-qty-name,
        html[dir="rtl"] .pickup-title,
        html[dir="rtl"] .playlist-tab {
            flex-direction: row-reverse;
        }
        html[dir="rtl"] .client-info,
        html[dir="rtl"] .column-header h2,
        html[dir="rtl"] .menu-mgmt-panel h2,
        html[dir="rtl"] .menu-mgmt-panel p,
        html[dir="rtl"] .playlist-tab-info {
            text-align: right;
        }

        /* Menu management overlay */
        .menu-mgmt-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            height: 100%;
            overflow-y: auto;
        }

        .menu-mgmt-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .menu-mgmt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
        }

        /* Switch toggles */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s; border-radius: 24px; border: 1px solid var(--glass-border);
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Waiter assignment table */
        .assignment-view {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 24px;
            height: 100%;
        }
        .assignment-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .assignment-table th, .assignment-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--glass-border);
            text-align: left;
            font-size: 14px;
        }
        html[dir="rtl"] .assignment-table th, html[dir="rtl"] .assignment-table td {
            text-align: right;
        }
    </style>
</head>
<body>

    <!-- Top Manager Role Switcher (For Demo & Multi-tenant simulation) -->
    <div id="manager-switcher-container" style="display:none; background: #f59e0b; color: #000; padding: 6px 20px; font-size: 13px; font-weight: 600; text-align: center; border-bottom: 1px solid #d97706;">
        <div style="max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">

            <div>

                    <option value="boss@atelier-chris.fr">📈 Gestionnaire (Toutes les fonctions)</option>
                    <option value="chef@atelier-chris.fr">👨‍🍳 Cuisine / Chef (chef@atelier-chris.fr)</option>
                    <option value="maitre@atelier-chris.fr">🤵 Chef de Salle (maitre@atelier-chris.fr)</option>
                    <option value="david@atelier-chris.fr">🏃‍♂️ Serveur David (david@ - Tables 5, 8, 12)</option>

                    <option value="pickup@atelier-chris.fr">📺 Comptoir Public (pickup@ - Mode Kiosque Retrait)</option>
                    <option value="barman@atelier-chris.fr">🍹 Barman (barman@ - Boissons)</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="dashboard-header" style="flex-wrap: wrap; gap: 12px;">
        <div style="display:flex; align-items:center; gap: 16px;">
            <div class="logo">
                <span class="logo-accent">Ciao</span> Byebye 
                <span id="dashboard-role-title" style="font-size: 14px; font-weight:400; color:var(--text-muted); margin-left: 10px;">Tableau de Bord</span>
            </div>

            <!-- Main Feature Navigation Tabs -->
            <nav id="dashboard-main-nav" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <button class="action-btn active" id="tab-btn-kds" onclick="switchMainTab('kds')" style="padding:6px 12px; font-size:12px;">
                    <i class="fa-solid fa-fire-burner"></i> KDS Cuisine
                </button>
                <button class="action-btn secondary" id="tab-btn-floorplan" onclick="switchMainTab('floorplan')" style="padding:6px 12px; font-size:12px;">
                    <i class="fa-solid fa-map"></i> Plan de Tables 2D
                </button>
                <button class="action-btn secondary" id="tab-btn-inventory" onclick="switchMainTab('inventory')" style="padding:6px 12px; font-size:12px;">
                    <i class="fa-solid fa-boxes-stacked"></i> Stocks & BOM
                </button>
                <button class="action-btn secondary" id="tab-btn-modules" onclick="switchMainTab('modules')" style="padding:6px 12px; font-size:12px;">
                    <i class="fa-solid fa-toggle-on"></i> Modules & Offres
                </button>
                <button class="action-btn secondary" id="tab-btn-menu" onclick="switchMainTab('menu')" style="padding:6px 12px; font-size:12px;">
                    <i class="fa-solid fa-utensils"></i> Menu
                </button>
            </nav>
        </div>

        <div class="stats-container">
            <!-- Lang, Currency & Fullscreen Selectors -->
            <div class="i18n-selectors" style="display:flex; align-items:center; gap:6px;">
                <select id="kds-lang-select" onchange="changeKdsLanguage(this.value)" class="glass-select" aria-label="Langue">
                    <option value="fr">🇫🇷 FR</option>
                    <option value="en">🇬🇧 EN</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="es">🇪🇸 ES</option>
                </select>
                <select id="kds-currency-select" onchange="changeKdsCurrency(this.value)" class="glass-select" aria-label="Devise">
                    <option value="EUR">EUR (€)</option>
                    <option value="USD">USD ($)</option>
                    <option value="GBP">GBP (£)</option>
                    <option value="MAD">MAD (DH)</option>
                    <option value="SAR">SAR (﷼)</option>
                    <option value="AED">AED (د.إ)</option>
                </select>
                <button onclick="toggleFullscreen()" class="glass-select" title="Plein Écran TV" style="display:flex; align-items:center; justify-content:center; padding:6px 10px;">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>

            <div id="header-btn-container"></div>
            
            <div class="stat-badge">
                <i class="fa-solid fa-fire-burner"></i> <span id="stat-cooking-label">En Cuisine :</span> <span id="stat-cooking">0</span>
            </div>
            <div class="stat-badge">
                <i class="fa-solid fa-mug-hot"></i> <span id="stat-ready-label">Prêtes :</span> <span id="stat-ready">0</span>
            </div>
            
            <div class="user-profile" style="display: flex; align-items: center; gap: 12px; border-left: 1px solid var(--glass-border); padding-left: 15px;">
                <span id="user-email" style="font-size: 13px; color: var(--text-muted);">chef@atelier-chris.fr</span>
                <button onclick="logout()" title="Déconnexion" style="background: none; border: none; color: #ef4444; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 4px; font-family: inherit;"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Columns Grid -->
    <main class="dashboard-content" id="dashboard-main-content">
        <!-- Dynamic content rendered via JS -->
    </main>

    <!-- WebSockets & Logic -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Promotional & Preparation Video Playlist for Public Display
        const promoVideos = [
            {
                id: "milkshake",
                title: "🥤 Milkshake Gourmet Fraise & Chantilly",
                desc: "Préparation onctueuse et crémeuse au lait bio et coulis de fraises fraîches.",
                src: "https://assets.mixkit.co/videos/preview/mixkit-pouring-milk-into-a-glass-with-strawberries-42995-large.mp4",
                badge: "Recette du Chef"
            },
            {
                id: "tacos",
                title: "🌮 Tacos & Smash Burgers Grill",
                desc: "Cuisson de viande hachée fraîche, cheddar fondant et sauce maison.",
                src: "https://assets.mixkit.co/videos/preview/mixkit-frying-a-hamburger-patty-on-a-grill-42939-large.mp4",
                badge: "En direct du Grill"
            },
            {
                id: "cocktail",
                title: "🍹 Cocktails & Mocktails Signature",
                desc: "Mixologie artisanale avec jus de fruits pressés et herbes aromatiques.",
                src: "https://assets.mixkit.co/videos/preview/mixkit-bartender-pouring-a-drink-into-a-glass-42997-large.mp4",
                badge: "Mixologie Live"
            },
            {
                id: "promo",
                title: "🔥 Formule Midi & Happy Hour",
                desc: "-20% sur les cocktails et desserts tous les soirs de 17h à 19h !",
                src: "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-and-serving-food-plates-42937-large.mp4",
                badge: "Offre Spéciale"
            }
        ];

        let currentPromoVideoIndex = 0;

        function setPromoVideo(index) {
            currentPromoVideoIndex = index;
            const videoEl = document.getElementById('kiosk-promo-video');
            const badgeEl = document.getElementById('kiosk-video-badge');
            if (videoEl && promoVideos[index]) {
                videoEl.src = promoVideos[index].src;
                videoEl.play().catch(e => console.log('Autoplay handled'));
                if (badgeEl) badgeEl.innerText = promoVideos[index].badge;
            }
            document.querySelectorAll('.playlist-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });
        }

        // Translations dictionary for KDS
        const kdsTranslations = {
            fr: {
                title_kds: "Tableau de Bord",
                stat_cooking: "En Cuisine :",
                stat_ready: "Prêtes :",

                btn_ready: "Prête à servir !",

                btn_manage_menu: "Gérer le Menu",
                btn_view_orders: "Voir Commandes",
                pickup_cooking: "En Préparation",
                pickup_ready: "Prêt au comptoir",
                pickup_no_cooking: "Aucune commande en cours",

                table_prefix: "Table",

                timer_min: "min",
                empty_cooking: "Aucune commande en préparation.",

                menu_mgmt_title: "Gestion du Menu & Création de Plats",

                menu_tab_create: "➕ Créer un Plat",
                menu_tab_scan: "📸 Scanner une Carte (Photo / IA)",
                menu_tab_url: "🌐 Importer par URL & Design System",
                url_input_label: "URL du site web ou restaurant en ligne :",
                btn_scrape_url: "Analyser le Site & Extraire (Menu + Design System)",

        const kdsCurrencies = {
            EUR: { symbol: '€', rate: 1.0, position: 'after' },
            USD: { symbol: '$', rate: 1.08, position: 'before' },
            GBP: { symbol: '£', rate: 0.85, position: 'before' },
            MAD: { symbol: 'DH', rate: 10.80, position: 'after' },
            SAR: { symbol: '﷼', rate: 4.05, position: 'after' },
            AED: { symbol: 'د.إ', rate: 3.97, position: 'after' }
        };

        let kdsLang = localStorage.getItem('ciao_kds_lang') || 'fr';
        let kdsCurrency = localStorage.getItem('ciao_kds_currency') || 'EUR';

        function formatKdsPrice(euroAmount) {
            const curr = kdsCurrencies[kdsCurrency] || kdsCurrencies.EUR;
            const converted = euroAmount * curr.rate;
            const formatted = converted.toFixed(2);
            return curr.position === 'before' ? `${curr.symbol} ${formatted}` : `${formatted} ${curr.symbol}`;
        }

        function changeKdsLanguage(lang) {
            kdsLang = lang;
            localStorage.setItem('ciao_kds_lang', lang);
            const select = document.getElementById('kds-lang-select');
            if (select) select.value = lang;

            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', lang);
            }

            updateRoleTitle();
            renderDashboard();
        }

        function changeKdsCurrency(curr) {
            kdsCurrency = curr;
            localStorage.setItem('ciao_kds_currency', curr);
            const select = document.getElementById('kds-currency-select');
            if (select) select.value = curr;

            renderDashboard();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // SSO / Session Authentication guard
        if (sessionStorage.getItem('ciao_byebye_auth') !== 'true') {
            window.location.href = 'login.html';
        }

        // Get user session data
        const loggedUserEmail = sessionStorage.getItem('ciao_byebye_user') || 'chef@atelier-chris.fr';
        const loggedUserRole = sessionStorage.getItem('ciao_byebye_role') || 'cuisine';
        
        let activeEmail = loggedUserEmail;
        let activeRole = loggedUserRole;
        let showMenuManagement = false;

        let activeMainTab = 'kds'; // 'kds' | 'floorplan' | 'inventory' | 'modules' | 'menu'
        let kdsActiveStation = 'all'; // 'all' | 'chaud' | 'froid' | 'bar' | 'passe'
        let floorPlanActiveZone = 'all'; // 'all' | 'salle' | 'terrasse' | 'mezzanine' | 'bar'
        let floorPlanTables = [];
        let selectedTableModalData = null;
        let inventoryIngredients = [];
        let inventoryRecipes = [];
        let inventoryLogs = [];
        let inventoryActiveSubTab = 'ingredients'; // 'ingredients' | 'recipes' | 'waste'
        let restaurantModulesList = [];

        function switchMainTab(tab) {
            activeMainTab = tab;
            showMenuManagement = (tab === 'menu');
            
            ['kds', 'floorplan', 'inventory', 'modules', 'menu'].forEach(tName => {
                const btn = document.getElementById(`tab-btn-${tName}`);
                if (btn) {
                    if (tName === tab) {
                        btn.className = 'action-btn active';
                    } else {
                        btn.className = 'action-btn secondary';
                    }
                }
            });

            updateRoleTitle();
            if (tab === 'floorplan') {
                renderFloorPlanView();
            } else if (tab === 'inventory') {
                renderInventoryView();
            } else if (tab === 'modules') {
                renderModulesView();
            } else if (tab === 'menu') {
                renderMenuManagement();
            } else {
                fetchOrders();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('user-email').innerText = loggedUserEmail;
            
            const langSelect = document.getElementById('kds-lang-select');
            if (langSelect) langSelect.value = kdsLang;
            const currSelect = document.getElementById('kds-currency-select');
            if (currSelect) currSelect.value = kdsCurrency;

            changeKdsLanguage(kdsLang);

            if (loggedUserRole === 'gestionnaire') {
                document.getElementById('manager-switcher-container').style.display = 'block';
                document.getElementById('active-profile-select').value = activeEmail;
            }
            
            updateRoleTitle();
            fetchOrders();
            setInterval(updateTimersDisplay, 10000);
        });

        function changeSimulatedProfile(email) {
            activeEmail = email;
            if (email === 'chef@atelier-chris.fr') activeRole = 'cuisine';
            else if (email === 'maitre@atelier-chris.fr') activeRole = 'chef_de_salle';
            else if (email.startsWith('david') || email.startsWith('sophie')) activeRole = 'serveur';
            else if (email === 'pickup@atelier-chris.fr') activeRole = 'technique';
            else if (email === 'barman@atelier-chris.fr') activeRole = 'bar';
            else activeRole = 'gestionnaire';

            showMenuManagement = false;
            updateRoleTitle();
            fetchOrders();
        }

        function updateRoleTitle() {
            const t = kdsTranslations[kdsLang] || kdsTranslations.fr;
            const roleLabels = {
                'cuisine': '👨‍🍳 ' + t.title_kds + ' - Cuisine',
                'chef_de_salle': '🤵 ' + t.title_kds + ' - Chef de Salle',
                'serveur': '🏃 ' + t.title_kds + ' - Serveur',
                'bar': '🍹 ' + t.title_kds + ' - Bar',
                'technique': '📺 ' + t.pickup_ready + ' (Borne Retrait)',
                'gestionnaire': '📈 ' + t.title_kds + ' - Direction'
            };
            document.getElementById('dashboard-role-title').innerText = roleLabels[activeRole] || t.title_kds;

            const statCook = document.getElementById('stat-cooking-label');
            if (statCook) statCook.innerText = t.stat_cooking;
            const statRdy = document.getElementById('stat-ready-label');
            if (statRdy) statRdy.innerText = t.stat_ready;

            const headerBtnContainer = document.getElementById('header-btn-container');
            if (activeRole === 'cuisine' || activeRole === 'gestionnaire') {
                headerBtnContainer.innerHTML = `
                    <button class="action-btn secondary" onclick="toggleMenuManagement()">
                        <i class="fa-solid fa-utensils"></i> ${showMenuManagement ? t.btn_view_orders : t.btn_manage_menu}
                    </button>
                `;
            } else {
                headerBtnContainer.innerHTML = '';
            }
        }

        function toggleMenuManagement() {
            showMenuManagement = !showMenuManagement;
            updateRoleTitle();
            if (showMenuManagement) {
                renderMenuManagement();
            } else {
                fetchOrders();
            }
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        const socket = typeof io !== 'undefined' ? io() : null;
        let orders = [];

        async function fetchOrders() {
            if (activeMainTab !== 'kds' && activeMainTab !== 'floorplan') return;
            try {
                let url = `/api/orders?email=${encodeURIComponent(activeEmail)}`;
                if (kdsActiveStation && kdsActiveStation !== 'all') {
                    url += `&station=${kdsActiveStation}`;
                }
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch orders');
                orders = await response.json();
                renderDashboard();
            } catch (error) {
                console.error('Error fetching orders:', error);
            }
        }

        function renderDashboard() {
            if (activeRole === 'technique') {
                renderPublicPickupView();
                return;
            }

            if (activeMainTab === 'floorplan') {
                renderFloorPlanView();
                return;
            } else if (activeMainTab === 'inventory') {
                renderInventoryView();
                return;
            } else if (activeMainTab === 'modules') {
                renderModulesView();
                return;
            } else if (activeMainTab === 'menu') {
                renderMenuManagement();
                return;
            }

            if (activeRole === 'chef_de_salle') {
                renderChefDeSalleView();
                return;
            }

            renderKdsView();
        }

        async function submitAddTable(e) {
            e.preventDefault();
            const number = document.getElementById('add-table-num').value;
            const zone = document.getElementById('add-table-zone').value;
            const shape = document.getElementById('add-table-shape').value;
            const max_covers = parseInt(document.getElementById('add-table-max').value, 10);
            try {
                await fetch('/api/tables/layout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number, name: `Table ${number}`, zone, shape, max_covers, nominal_covers: max_covers, pos_x: 120, pos_y: 120 })
                });
                closeTableModal();
                renderFloorPlanView();
            } catch (err) {
                console.error(err);
            }
        }

                    fetch('/api/inventory/recipes'),

        async function handleCreateDishSubmit(e) {
            e.preventDefault();

                        name,
                        category,
                        price,
                        description,
                        image_url,
                        is_available: true
                    })
                });

                const data = await res.json();
                showKdsToast(`🎉 Plat "${name}" créé et publié avec succès !`);

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                const previewImg = document.getElementById('scanned-preview-img');
                const previewBox = document.getElementById('scanned-preview-box');
                if (previewImg && previewBox) {
                    previewImg.src = base64Image;
                    previewBox.style.display = 'block';
                }
                processPhotoScan(base64Image);
            };
            reader.readAsDataURL(file);
        }

        async function scanPresetNagaMenu() {
            const nagaMenuImg = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&q=80&w=800";
            const previewImg = document.getElementById('scanned-preview-img');
            const previewBox = document.getElementById('scanned-preview-box');
            if (previewImg && previewBox) {
                previewImg.src = nagaMenuImg;
                previewBox.style.display = 'block';
            }
            processPhotoScan(nagaMenuImg);
        }

        async function reparseCustomText() {
            const customText = document.getElementById('ocr-raw-text')?.value;
            processPhotoScan(null, customText);
        }

        async function processPhotoScan(imageData, customText = '') {
            const laser = document.getElementById('scan-laser');
            const statusBox = document.getElementById('scan-status-box');
            if (laser) laser.style.display = 'block';
            if (statusBox) statusBox.style.display = 'block';

            try {
                const res = await fetch('/api/menu/scan-photo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_data: imageData,
                        custom_text: customText
                    })
                });

                if (!res.ok) throw new Error('Erreur scan photo');
                const data = await res.json();
                detectedScanItems = data.detected_items || [];
                
                showKdsToast(`✨ ${detectedScanItems.length} plats extraits de la carte avec succès !`);
                renderMenuManagement();
            } catch (err) {
                console.error(err);
                alert('Erreur lors du scan du menu.');
            } finally {
                if (laser) laser.style.display = 'none';
                if (statusBox) statusBox.style.display = 'none';
            }
        }

                            </div>
                            <div class="url-chip" onclick="setScrapePreset('https://trattoria-bella.it/menu')">
                                🍕 Trattoria Bella Italia
                            </div>
                        </div>

                        <!-- Scrape Loader -->
                        <div id="scrape-loader-box" style="display:none; padding:12px; background:rgba(245,158,11,0.1); border:1px solid var(--primary); border-radius:var(--radius-sm); text-align:center; font-size:13px; color:var(--primary); font-weight:600;">
                            <i class="fa-solid fa-spinner fa-spin"></i> Analyse approfondie du site et extraction du Design System en cours...
                        </div>
                    </div>

                    <!-- EXTRACTED DESIGN SYSTEM PANEL -->
                    ${ds ? `
                        <div class="design-system-preview-card">
                            <div class="design-system-header">
                                <div class="brand-avatar-box">
                                    <img src="${ds.logo_url || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&q=80&w=200'}" alt="Logo" class="brand-logo-img">
                                    <div>
                                        <div class="brand-title-text">${ds.brand_name}</div>
                                        <div class="brand-tagline-text">${ds.tagline}</div>
                                    </div>
                                </div>
                                <button type="button" class="btn-primary-glow" onclick="applyScrapedDesignSystem()" style="padding:10px 20px; font-size:13px;">
                                    <i class="fa-solid fa-palette"></i> ${t.btn_apply_theme}
                                </button>
                            </div>

                            <!-- Color Palette Swatches -->
                            <div style="font-size:12px; font-weight:700; color:#fff; margin-bottom:8px;">
                                <i class="fa-solid fa-swatchbook" style="color:var(--primary);"></i> Palette de Couleurs Extraite :
                            </div>
                            <div class="theme-swatches-grid">
                                <div class="theme-swatch-item">
                                    <div class="swatch-color-pill" style="background:${ds.primary_color};"></div>
                                    <div class="swatch-label">Primaire</div>
                                    <div class="swatch-hex">${ds.primary_color}</div>
                                </div>
                                <div class="theme-swatch-item">
                                    <div class="swatch-color-pill" style="background:${ds.accent_color};"></div>
                                    <div class="swatch-label">Accent</div>
                                    <div class="swatch-hex">${ds.accent_color}</div>
                                </div>
                                <div class="theme-swatch-item">
                                    <div class="swatch-color-pill" style="background:${ds.bg_dark}; border:1px solid #444;"></div>
                                    <div class="swatch-label">Arrière-Plan</div>
                                    <div class="swatch-hex">${ds.bg_dark}</div>
                                </div>
                                <div class="theme-swatch-item">
                                    <div class="swatch-color-pill" style="background:${ds.card_bg}; border:1px solid #444;"></div>
                                    <div class="swatch-label">Cartes Glass</div>
                                    <div class="swatch-hex">Glassmorphism</div>
                                </div>
                                <div class="theme-swatch-item">
                                    <div class="swatch-color-pill" style="display:flex; align-items:center; justify-content:center; background:#1e1e24; color:#fff; font-size:10px; font-weight:bold;">
                                        ${ds.font_family.split(',')[0]}
                                    </div>
                                    <div class="swatch-label">Typographie</div>
                                    <div class="swatch-hex">${ds.font_family.split(',')[0].replace(/'/g, '')}</div>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- EXTRACTED MENU ITEMS TABLE -->
                    ${items.length > 0 ? `
                        <div class="form-card">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:14px;">
                                <h3><i class="fa-solid fa-utensils" style="color:#10b981;"></i> Plats Détectés (${items.length})</h3>
                                <button type="button" class="btn-primary-glow" onclick="importAllScrapedUrlItems()">
                                    <i class="fa-solid fa-cloud-arrow-down"></i> ${t.btn_import_all_db}
                                </button>
                            </div>

                            <div style="max-height: 480px; overflow-y: auto;">
                                <table class="detected-items-table">
                                    <thead>
                                        <tr>
                                            <th>Aperçu</th>
                                            <th>Plat & Ingrédients</th>
                                            <th>Catégorie</th>
                                            <th>Prix (€)</th>
                                            <th>Badges</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${items.map(item => `
                                            <tr>
                                                <td style="width: 54px;">
                                                    <img src="${item.image_url}" alt="${item.name}" style="width:46px; height:46px; border-radius:var(--radius-sm); object-fit:cover; border:1px solid var(--glass-border);">
                                                </td>
                                                <td>
                                                    <strong style="color:#fff; font-size:14px;">${item.name}</strong>
                                                    <div style="font-size:11px; color:var(--text-muted); line-height:1.3; margin-top:2px;">${item.description}</div>
                                                </td>
                                                <td>
                                                    <span class="badge-tag badge-wok">${item.category}</span>
                                                </td>
                                                <td>
                                                    <strong style="color:var(--primary); font-size:14px;">${(item.price_cents / 100).toFixed(2)} €</strong>
                                                </td>
                                                <td>
                                                    ${(item.tags || []).map(tag => `<span class="badge-tag badge-signature" style="font-size:10px; margin:2px;">${tag}</span>`).join('')}
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function setScrapePreset(url) {
            scrapedUrlInput = url;
            const input = document.getElementById('scrape-url-input');
            if (input) input.value = url;
            scrapeRestaurantUrl();
        }

        async function scrapeRestaurantUrl() {
            const input = document.getElementById('scrape-url-input');
            const url = input ? input.value.trim() : scrapedUrlInput;
            if (!url) {
                alert('Veuillez entrer une URL valide.');
                return;
            }
            scrapedUrlInput = url;

            const loader = document.getElementById('scrape-loader-box');
            const btn = document.getElementById('btn-run-scrape');
            if (loader) loader.style.display = 'block';
            if (btn) btn.disabled = true;

            try {
                const res = await fetch('/api/menu/scrape-url', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!res.ok) throw new Error('Erreur scraping URL');
                const data = await res.json();
                extractedScrapeData = data;

                showKdsToast(`🎉 ${data.extracted_count} plats et le Design System de "${data.brand_name}" extraits avec succès !`);
                renderMenuManagement();
            } catch (err) {
                console.error(err);
                alert('Erreur lors de l\'extraction du site web.');
            } finally {
                if (loader) loader.style.display = 'none';
                if (btn) btn.disabled = false;
            }
        }

        async function applyScrapedDesignSystem() {
            if (!extractedScrapeData || !extractedScrapeData.design_system) return;

            try {
                const res = await fetch('/api/theme/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ theme: extractedScrapeData.design_system })
                });

                if (!res.ok) throw new Error('Erreur application thème');
                const data = await res.json();
                applyActiveTheme(data.theme);
                showKdsToast(`🎨 Design System de ${data.theme.brand_name} appliqué en direct !`);
            } catch (err) {
                console.error(err);
                alert('Erreur lors de l\'application du thème.');
            }
        }

        async function importAllScrapedUrlItems() {
            if (!extractedScrapeData || !extractedScrapeData.menu_items || extractedScrapeData.menu_items.length === 0) return;

            try {
                const res = await fetch('/api/menu/bulk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ products: extractedScrapeData.menu_items })
                });

                if (!res.ok) throw new Error('Erreur import menu URL');
                const data = await res.json();
                showKdsToast(`🎉 ${data.count} plats importés en base de données et publiés sur le menu client !`);
                currentMenuSubTab = 'catalog';
                renderMenuManagement();
            } catch (err) {
                console.error(err);
                alert('Erreur lors de l\'enregistrement des plats.');
            }
        }

        // ==========================================
        // DYNAMIC THEME SUPPORT FOR KDS
        // ==========================================
        function applyActiveTheme(theme) {
            if (!theme) return;
            const root = document.documentElement;
            if (theme.primary_color) {
                root.style.setProperty('--primary', theme.primary_color);
                root.style.setProperty('--primary-color', theme.primary_color);
            }
            if (theme.primary_glow) {
                root.style.setProperty('--primary-glow', theme.primary_glow);
            }
            if (theme.accent_color) {
                root.style.setProperty('--accent', theme.accent_color);
            }
            if (theme.bg_dark) {
                root.style.setProperty('--bg-dark', theme.bg_dark);
            }
            if (theme.card_bg) {
                root.style.setProperty('--card-bg', theme.card_bg);
            }
            if (theme.font_family) {
                root.style.setProperty('--font-main', theme.font_family);
            }
            if (theme.brand_name) {
                const brandTitle = document.getElementById('kds-brand-title');
                if (brandTitle) brandTitle.innerText = theme.brand_name;
            }
        }

        async function loadActiveTheme() {
            try {
                const res = await fetch('/api/theme/active');
                if (res.ok) {
                    const data = await res.json();
                    if (data.theme) applyActiveTheme(data.theme);
                }
            } catch (e) {}
        }

        loadActiveTheme();

        if (socket) {
            socket.on('theme_updated', (theme) => {
                applyActiveTheme(theme);
            });
            socket.on('new_order', () => {
                fetchOrders();
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                } catch (e) {
                    console.log('Audio alert blocked or failed');
                }
            });

            socket.on('order_status_updated', () => {
                fetchOrders();
            });

            socket.on('tables_assigned', () => {
                if (activeRole === 'chef_de_salle' || activeRole === 'serveur') {
                    fetchOrders();
                }
            });

            socket.on('menu_updated', () => {
                if (showMenuManagement) {
                    renderMenuManagement();
                }
            });

            socket.on('table_layout_updated', () => {
                if (activeMainTab === 'floorplan') {
                    renderFloorPlanView();
                }
            });

            socket.on('course_status_updated', () => {
                if (activeMainTab === 'kds') {
                    fetchOrders();
                }
            });

            socket.on('allergy_acknowledged', () => {
                if (activeMainTab === 'kds') {
                    fetchOrders();
                }
            });

            socket.on('inventory_updated', () => {
                if (activeMainTab === 'inventory') {
                    renderInventoryView();
                }
            });

            socket.on('inventory_86_alert', (data) => {
                showKdsToast(`🚨 RUPTURE 86 : L'ingrédient ${data.ingredient_name || ''} est épuisé !`);
                if (activeMainTab === 'inventory') {
                    renderInventoryView();
                }
            });

            socket.on('module_toggled', () => {
                if (activeMainTab === 'modules') {
                    renderModulesView();
                }
            });
        }
    </script>
</body>
</html>
